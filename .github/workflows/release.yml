name: Release

on:
  push:
    branches: ["**"]

permissions:
  contents: write

# Repeated runs for the same source serialize; other pushes cannot cancel them.
concurrency:
  group: release-${{ github.event.after }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.deleted == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Check exact commit message
        id: request
        run: |
          bun -e 'import { appendFileSync } from "node:fs"; import { releaseTag } from "./scripts/release"; const event = await Bun.file(process.env.GITHUB_EVENT_PATH).json(); if (releaseTag(event.head_commit.message)) appendFileSync(process.env.GITHUB_OUTPUT, "release=true\n");'

      - name: Check publishing credentials
        if: steps.request.outputs.release == 'true'
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_CONFIG_TOKEN" || { echo "NPM_TOKEN is not configured." >&2; exit 1; }
          bun pm whoami

      - name: Configure release identity
        if: steps.request.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify, version, and tag
        if: steps.request.outputs.release == 'true'
        id: prepare
        run: bun run scripts/release.ts

      - name: Publish to npm
        if: steps.prepare.outputs.tag != ''
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: bun publish --access public --tolerate-republish --tag latest

      - name: Create GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --latest
          fi
